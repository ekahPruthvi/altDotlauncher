[package]
name = "altDot"
version = "1.2.20"
edition = "2021"
authors = ["ekahPruthvi <ekahpdp@gmail.com>"]
description = "An alternate dynamicLauncher"
license = "GPL-3.0"
repository = "https://github.com/ekahPruthvi/altDotlauncher.git"

[dependencies]
chrono = "0.4.41"
fuzzy-matcher = "0.3.7"
glob = "0.3.2"
groq-api-rust = "0.2.51"
gtk4 = "0.11.5"
gtk4-layer-shell = "0.8.1"
tokio = { version = "1.45.0", features = ["full"] }
async-channel = "2"
evdev = "0.13"
self_update = "1.3.0"
libc = "0.2.189"
serde_json = "1"
infoprober = "0.1.0"
ureq = { version = "2", features = ["json"] }
rodio = "0.17"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
overflow-checks = false
debug-assertions = false
